name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --no-sources
      - run: uv run --no-sources ruff format --check src
      - run: uv run --no-sources ruff check src

  types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [Linux, Darwin, Windows]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --no-sources
      - run: uv run --no-sources basedpyright --pythonplatform ${{ matrix.platform }} src
