[project]
name = "boring-http"
version = "0.1.0"
description = "Asyncio HTTP client on BoringSSL: HTTP/1.1, HTTP/2 and HTTP/3 over QUIC, WebSocket on all three, HTTP and SOCKS proxies, headers in your order"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Huynh Bao Bien", email = "276976028+baobien-dev@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boring-ssl2",
    "ssl2",
]

[project.urls]
Repository = "https://github.com/baobien-dev/boring-http"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.3",
]

[tool.uv.sources]
ssl2 = { path = "../ssl2", editable = true }
boring-ssl2 = { path = "../boring-ssl2", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",    # the size of a function is a reading matter, not a count
    "COM812",  # the formatter places trailing commas
    "CPY",     # no copyright headers
    "D",       # no docstrings
    "E501",    # the formatter wraps lines
    "EM",      # a message is written in the raise
    "PLR0911", # returns, branches, statements and arguments are not counted either
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "TC",      # imports stay at the top, not under TYPE_CHECKING
    "TRY003",  # a message is written in the raise
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["INP001", "T201"]  # standalone scripts that report to the person running them

[tool.basedpyright]
typeCheckingMode = "strict"
reportImplicitOverride = true
reportImportCycles = true
reportUnnecessaryTypeIgnoreComment = true
